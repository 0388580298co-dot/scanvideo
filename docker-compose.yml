services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file: [.env]
    volumes:
      - .:/workspace
      - media_data:/data/media
      - ./.secrets:/secrets
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}
    env_file: [.env]
    volumes:
      - .:/workspace
      - media_data:/data/media
      - ./.secrets:/secrets
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A apps.worker.celery_app.celery_app beat --loglevel=INFO
    env_file: [.env]
    volumes: [".:/workspace"]
    depends_on:
      redis: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanvideo
      POSTGRES_USER: scanvideo
      POSTGRES_PASSWORD: scanvideo
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanvideo -d scanvideo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  media_data:
