services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/workspace
      - media_data:/data/media
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: celery -A apps.worker.celery_app.celery_app worker --loglevel=INFO
    env_file:
      - .env
    volumes:
      - .:/workspace
      - media_data:/data/media
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanvideo
      POSTGRES_USER: scanvideo
      POSTGRES_PASSWORD: scanvideo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  media_data:
