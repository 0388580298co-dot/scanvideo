[project]
name = "scanvideo"
version = "0.4.0"
description = "AI-first short-video localization and publishing platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "celery>=5.4,<6",
  "requests>=2.32,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]
media = [
  "faster-whisper>=1.1,<2",
  "yt-dlp>=2026.7.4,<2027",
  "edge-tts>=7,<8",
]
translation = [
  "argostranslate>=1.9,<2",
]
publishing = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["apps*"]
exclude = ["tests*", "web*", "infra*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
